.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}

.card:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.card:focus-visible{outline:4px solid var(--r);outline-offset:3px}
.tile{height:150px;display:grid;place-items:center;font-size:64px;border-bottom:3px solid var(--ink)}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.body h2{font-weight:900;font-size:22px}
.body p{font-weight:700;font-size:15px;line-height:1.8}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.chip{background:var(--ink);color:var(--y);font-weight:700;font-size:13px;padding:3px 12px;border-radius:99px}
.go{font-weight:900;font-size:15px;color:var(--r)}
.soon{border-style:dashed;box-shadow:none;cursor:default;opacity:.85}
.soon:hover{transform:none;box-shadow:none}
.soon .tile{background:repeating-linear-gradient(45deg,#0000000a,#0000000a 10px,#00000014 10px,#00000014 20px)}
footer{margin-top:34px;text-align:center;font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.btn{font:inherit;font-weight:900;font-size:15px;background:var(--ink);color:var(--y);border:0;border-radius:99px;padding:10px 26px;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--r);outline-offset:3px}
.vw{position:fixed;inset:0;background:#000000e6;display:none;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.vw.on{display:flex}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
.stage iframe{height:100%;aspect-ratio:9/16;max-width:100vw;border:0;border-radius:14px;background:var(--y)}
.bar{display:flex;gap:10px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .btn{background:var(--y);color:var(--ink);padding:9px 20px;font-size:14px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;padding:9px 18px;border-radius:99px;font-size:14px;z-index:30;display:none;max-width:90vw;direction:ltr;overflow-wrap:anywhere}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

)});\nf.addEventListener('pointerup',function(e){f.classList.remove('hold');if(e.target.id==='re'){go(0);return}\n  if(Date.now()-t0<300){var r=f.getBoundingClientRect();(e.clientX-r.left)>r.width/2?go(cur+1):go(cur-1)}});\nf.addEventListener('pointercancel',function(){f.classList.remove('hold')});\ndocument.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});\ngo(0);\n<\/script>\n<\/body>\n<\/html>\n"};
var g=document.getElementById('grid'),vw=document.getElementById('vw'),stage=document.getElementById('stage'),ts=document.getElementById('ts'),openId=null;
LESSONS.forEach(function(l){
  var b=document.createElement('button');b.className='card';b.type='button';
  b.innerHTML='<div class="tile" style="background:'+l.bg+'">'+l.emo+'</div><div class="body"><h2>'+l.title+'</h2><p>'+l.desc+'</p><div class="meta"><span class="chip">'+l.n+'</span><span class="go">ببین ▶</span></div></div>';
  b.onclick=function(){open(l.id)};
  g.appendChild(b);
});
var s=document.createElement('div');s.className='card soon';
s.innerHTML='<div class="tile">🎬</div><div class="body"><h2>آموزش بعدی در راهه...</h2><p>بزودی یه موضوع جذاب دیگه اضافه می‌شه. دنبال کن!</p></div>';
g.appendChild(s);
function open(id){
  if(!HTML[id])return;
  openId=id;stage.innerHTML='';
  var f=document.createElement('iframe');f.title=id;f.setAttribute('sandbox','allow-scripts');f.srcdoc=HTML[id];
  stage.appendChild(f);vw.classList.add('on');
  try{if(location.hash!=='#'+id)location.hash=id}catch(e){}
}
function close(){vw.classList.remove('on');stage.innerHTML='';openId=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
function toast(t){ts.textContent=t;ts.classList.add('on');setTimeout(function(){ts.classList.remove('on')},2600)}
function copy(u){
  function fb(){toast(u)}
  try{navigator.clipboard.writeText(u).then(function(){toast('لینک کپی شد ✅')},fb)}catch(e){fb()}
}
function base(){return location.href.split('#')[0]}
document.getElementById('cl').onclick=close;
document.getElementById('cp').onclick=function(){copy(base())};
document.getElementById('cs').onclick=function(){copy(base()+'#'+openId)};
document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
function route(){var h=location.hash.slice(1);if(h&&HTML[h]&&h!==openId)open(h);else if(!h&&openId)close()}
window.addEventListener('hashchange',route);route();
